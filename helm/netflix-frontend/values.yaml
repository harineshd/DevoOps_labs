replicaCount: 2

image:
  repository: streamflix-frontend
  tag: v1.0.0
  pullPolicy: IfNotPresent

service:
  name: frontend-service
  type: ClusterIP
  port: 80

backendHost: "backend-service:5000"

ingress:
  enabled: true
  className: nginx
  host: localhost:8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi