replicaCount: 2

image:
  repository: harinesh450/netflix-frontend
  tag: b20eb4e
  pullPolicy: IfNotPresent

service:
  name: frontend-service
  type: ClusterIP
  port: 80

backendHost: "backend-service:5000"

ingress:
  enabled: true
  className: nginx
  host: localhost:8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi