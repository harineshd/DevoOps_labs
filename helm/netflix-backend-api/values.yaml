replicaCount: 2

image:
  repository: harinesh450/netflix-backend
  tag: 23227b4
  pullPolicy: IfNotPresent

service:
  name: backend-service
  type: ClusterIP
  port: 5000

env:
  nodeEnv: "production"
  port: "5000"
  dbHost: "postgres-service"
  dbPort: "5432"
  dbName: "streamflix"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 15
    periodSeconds: 15
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 5