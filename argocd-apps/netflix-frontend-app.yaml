apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netflix-frontend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/harineshd/DevoOps_labs.git'
    targetRevision: 3tireapplication_deployment
    path: helm/netflix-frontend
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: netflix-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true