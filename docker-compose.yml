services:
  # Database Service
  postgres:
    image: postgres:16-alpine
    container_name: streamflix-postgres
    restart: always
    environment:
      POSTGRES_USER: streamflix_admin
      POSTGRES_PASSWORD: SuperSecureK8sPassword2026!
      POSTGRES_DB: streamflix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      streamflix-network:
        aliases:
          - streamflix-postgres-service
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamflix_admin -d streamflix"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Service (Port 5007 mapped to 5000)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streamflix-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: streamflix
      DB_USER: streamflix_admin
      DB_PASSWORD: SuperSecureK8sPassword2026!
      APP_VERSION: v1.0.0
      POD_IP: 172.20.0.3
      NODE_NAME: docker-compose-node
    ports:
      - "5007:5000"
    networks:
      streamflix-network:
        aliases:
          - streamflix-backend-service
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend Service (Port 8090 mapped to 80)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: streamflix-frontend
    restart: always
    environment:
      BACKEND_HOST: backend:5000
    ports:
      - "8090:80"
    networks:
      streamflix-network:
    depends_on:
      - backend

networks:
  streamflix-network:
    driver: bridge

volumes:
  postgres_data:
