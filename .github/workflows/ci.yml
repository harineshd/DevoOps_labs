name: Netflix 3-Tier CI/CD Pipeline

on:
  push:
    branches:
      - 3tireapplication_deployment
      - main
  pull_request:
    branches:
      - 3tireapplication_deployment
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime!

jobs:
  # ==========================================
  # STAGE 1: Code Lint, Tests & Security Scan
  # ==========================================
  test-and-scan:
    name: 🧪 Lint, Test & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install
          npm run build

      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm install --omit=dev

      # Security: Scan repo for CVEs & Hardcoded Secrets with Trivy
      - name: 🛡️ Trivy Filesystem & Secrets Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ==========================================
  # STAGE 2: Build & Push Docker Images
  # ==========================================
  build-and-push:
    name: 🐳 Docker Build & Push to Docker Hub
    needs: test-and-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Generate Short Git SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Build & Push Frontend Image (Multi-stage NGINX)
      - name: 🏗️ Build & Push Netflix Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/netflix-frontend:${{ steps.vars.outputs.short_sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/netflix-frontend:latest

      # Build & Push Backend API Image
      - name: 🏗️ Build & Push Netflix Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/netflix-backend:${{ steps.vars.outputs.short_sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/netflix-backend:latest

      # Security: Scan the freshly pushed container image for OS CVEs
      - name: 🛡️ Trivy Container Image Scan (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/netflix-frontend:${{ steps.vars.outputs.short_sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ==========================================
  # STAGE 3: GitOps Automated Helm Tag Update
  # ==========================================
  update-gitops:
    name: 🔄 Update Helm Values for ArgoCD
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Generate Short Git SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Automatically update image tags in values.yaml
      - name: ✍️ Update Image Tags in Helm values.yaml
        run: |
          NEW_TAG="${{ steps.vars.outputs.short_sha }}"
          USER="${{ secrets.DOCKERHUB_USERNAME }}"
          echo "Updating Helm charts to new tag: $NEW_TAG with repo: $USER"

          # Update Frontend values.yaml
          sed -i "s|repository: .*|repository: $USER/netflix-frontend|g" helm/netflix-frontend/values.yaml
          sed -i "s|tag: .*|tag: $NEW_TAG|g" helm/netflix-frontend/values.yaml

          # Update Backend values.yaml
          sed -i "s|repository: .*|repository: $USER/netflix-backend|g" helm/netflix-backend-api/values.yaml
          sed -i "s|tag: .*|tag: $NEW_TAG|g" helm/netflix-backend-api/values.yaml

      # Commit and push changes back to the repository
      - name: 🚀 Commit & Push Updated Helm Values
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/netflix-frontend/values.yaml helm/netflix-backend-api/values.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(gitops): auto-update Helm image tags to ${{ steps.vars.outputs.short_sha }} [skip ci]" && git push)
